# Robot parameters: the only place where they are set (params.py reads this file at start).
# Values are written as in Python: 0.27, True, (0.40, 0.65), "/dev/ttyACM0", None.
# key_deg = angle in degrees. A misspelled or missing key stops the program and says which.

[line_follower]
# --- speed and steering ---
V0 = 0.25              # top speed (m/s). Raise in small steps; if the robot goes wide in the curves, raise GAIN
GAIN = 1.1             # turn strength in the curves. > 1 turns harder; too high: weaves on straights
K = 0.165               # effective half track (m): converts turn rate to wheel speeds. Measure: python3 diag.py turn
TAU_EFF = 0.10         # camera + loop delay (s). Raise it if the robot weaves on straights (lowers the top speed)
A_LAT = 1.0            # max sideways acceleration in curves (m/s^2). Lower it if the robot skids out
A_UP = 0.5             # max acceleration (m/s^2)
A_DOWN = 1.5           # max braking (m/s^2)
BANDS = [0.20, 0.26, 0.31, 0.36]   # distances ahead where the line is looked for (m); the farthest one seen is aimed at
# --- image filter (check the result on http://<pi-ip>:8000/mask) ---
THRESHOLD = 200        # grey level above which a pixel is "line" (0-255). Lower it if the tape is dim
FILTER = True          # blur + threshold + opening against floor reflections. False = threshold only
BLUR = 3               # blur size (px)
OPEN_W = 9             # removes white blobs narrower than this (px). Keep it below the tape width
OPEN_H = 3             # removes white blobs shorter than this (px). A crossing tape is only ~4-5 px tall at 0.6 m: keep it at 3
USE_OTSU = False       # automatic threshold (max of Otsu and THRESHOLD); a large glare can then hide the tape
# --- camera position on the robot ---
H_CAM = 0.132          # camera height above the floor (m)
X_CAM = 0.104          # camera ahead of the robot centre (m)
TILT_deg = 30          # camera tilt below horizontal (deg)

[fsm]
# --- what the robot does ---
MISSION = None         # None = just follow the line (the 8). Grid mission: the line below, without the #
# MISSION = ("MISSION", (0, 0), "E", (4, 3), 5, 0.50)   # start node, start heading, goal node, nodes per side, m between nodes
AUTO_START = 1.0       # seconds after launch before it starts
TIME_STEP = 64         # loop period (ms)
# --- obstacles ---
D_STOP = 0.25          # stops when an obstacle is closer than this (m)
D_SLOW = 0.60          # starts slowing down below this distance (m)
SLOW_FRACTION = 0.25   # speed when reaching D_STOP, as a fraction of V0
T_STATIC = 2.0         # seconds still blocked before turning back (U-turn)
# --- turns and searching for the line ---
TURN_RATE = 0.5        # spin speed in turns (rad/s). Faster: the line passes the TURN_TOL_Y window in fewer than N_OK frames
TURN_EARLY_deg = 45    # a turn accepts the line from (angle - this) on: U-turn from 135 deg, 90 deg turns from 45 deg
TURN_LATE_deg = 90     # gives up a turn after (angle + this) without the line, then searches
TURN_TOL_Y = 0.04      # line counted as centred when this close to the axis, at the far band (m)
SEARCH_RATE = 1.0      # spin speed when searching for a lost line (rad/s)
N_OK = 3               # frames in a row with the line before taking it as found
T_MIN = 0.3            # min time in a state before "line lost" or "line found" counts (s)
# --- intersections (nodes) ---
V_NODE = 0.08          # speed from the node bar to the node centre (m/s)
K_HOLD = 2.0           # how hard it keeps its heading on the way to the node centre (1/s)
D_STRAIGHT = 0.20      # going straight: back to line following this far before the node centre (m)
PRIOR_TOL = 0.18       # mission only: a node seen farther than this from where the map expects it is ignored (m)

[robot_hardware]
PORT = "/dev/ttyACM0"  # Arduino serial port
CAM_WIDTH = 640        # camera image width (px)
CAM_HEIGHT = 480       # camera image height (px)
CAM_FOV_deg = 62.2     # camera horizontal field of view: 62.2 camera v2, 53.5 camera v1.3
CAM_ROTATED_180 = True # camera mounted upside down: flip the image
USE_ENCODERS = True    # True: wheel speed controlled by the Arduino (PI) and heading from the encoders
V_MAX = 0.60           # top wheel speed (m/s)
PWM_MIN = 45           # PWM that just starts a wheel (only with USE_ENCODERS = False)
WHEEL_R = 0.0325       # wheel radius (m)
COUNTS_PER_REV = 234.3 # encoder counts per wheel turn (11 x 21.3)
LIVE_VIEW = True       # camera and mask in the browser: http://<pi-ip>:8000/

[node_detector]
ZONE = (0.40, 0.65)    # distances ahead where an intersection bar is looked for (m); announced at the first one
REACH = 0.06           # white going this far sideways from the line = a bar (m)
LINE_W = 0.04          # widest white run still taken as the line itself (m)
THICK = (0.01, 0.03)   # accepted bar thickness, min and max (m). The tape is 0.019
AXIS = 0.04            # exit S: line beyond the bar within this of the axis (m)
BEYOND = (0.05, 0.15)  # exit S: where beyond the bar the line is looked for (m)
PERP_TOL_deg = 15      # the bar must be this close to perpendicular to the line (deg): rejects curves
N_FRAMES = 3           # frames to confirm an intersection
MISS = 1               # frames without the bar tolerated while confirming
S_TOL = 0.03           # those frames must agree on its position within this (m)
SAME = 0.10            # a bar within this of the last intersection is the same one (m)

# Copy of params.ini with a delivery MISSION. Run: ROBO_PARAMS=params_entrega.ini python3 robot_hardware.py
# Keep every other value equal to params.ini (calibrations!).
# Robot parameters: the only place where they are set (params.py reads this file at start).
# Values are written as in Python: 0.27, True, (0.40, 0.65), "/dev/ttyACM0", None.
# key_deg = angle in degrees. A misspelled or missing key stops the program and says which.

[line_follower]
# --- speed and steering ---
V0 = 0.25              # top speed (m/s). Raise in small steps; if the robot goes wide in the curves, raise GAIN
GAIN = 0.78            # turn strength in the curves. > 1 turns harder; too high: weaves on straights. (1.1 with the old camera geometry: same steering)
K = 0.165               # effective half track (m): converts turn rate to wheel speeds. Measure: python3 diag.py turn
TAU_EFF = 0.10         # camera + loop delay (s). Raise it if the robot weaves on straights (lowers the top speed)
A_LAT = 1.0            # max sideways acceleration in curves (m/s^2). Lower it if the robot skids out
A_UP = 0.5             # max acceleration (m/s^2)
A_DOWN = 1.5           # max braking (m/s^2)
BANDS = [0.147, 0.181, 0.204, 0.225]   # distances ahead where the line is looked for (m); the farthest one seen is aimed at. The camera sees the floor 0.15-0.40 m ahead
# --- image filter (check the result on http://<pi-ip>:8000/mask) ---
THRESHOLD = 200        # grey level above which a pixel is "line" (0-255). Lower it if the tape is dim
FILTER = True          # blur + threshold + opening against floor reflections. False = threshold only
BLUR = 5               # blur size (px)
OPEN_W = 15            # removes white blobs narrower than this (px). Keep it below the tape width (~35 px far)
OPEN_H = 5             # removes white blobs shorter than this (px). Keep it below a crossing tape (~16 px far)
USE_OTSU = False       # automatic threshold (max of Otsu and THRESHOLD); a large glare can then hide the tape
MIN_CONTRAST = 40      # a white run is the tape only if this much brighter than the floor beside it (grey levels): tape 50-180, floor glare < 25
# --- camera position on the robot ---
H_CAM = 0.104          # camera height above the floor (m): fitted on recorded images (tape width + bar motion vs odometry)
X_CAM = 0.104          # camera ahead of the robot centre (m)
TILT_deg = 43.4        # camera tilt below horizontal (deg): fitted on recorded images, as H_CAM

[fsm]
# --- what the robot does ---
MISSION = ("MISSION", (0, 0), "N", (1, 1), 5, 0.975)   # delivery: start (0, 0) facing north, goal (1, 1), 5x5 grid, 0.975 m between node centres (tape)
# MISSION = ("MISSION", (0, 0), "E", (4, 3), 5, 0.975)   # start node, start heading, goal node, nodes per side, m between node centres (track: 0.975)
NAV_ON_ARDUINO = False # True: the grid mission (graph + Dijkstra) runs on the Arduino (robo_fsm.ino, navigator.cpp)
AUTO_START = 0.0       # seconds after launch before it starts (the hardware is already up: Arduino and camera)
TIME_STEP = 64         # loop period (ms)
# --- obstacles ---
D_STOP = 0.25          # stops when an obstacle is closer than this (m)
D_SLOW = 0.60          # starts slowing down below this distance (m)
SLOW_FRACTION = 0.25   # speed when reaching D_STOP, as a fraction of V0
T_STATIC = 2.0         # seconds still blocked before turning back (U-turn)
# --- turns and searching for the line ---
TURN_RATE = 1.0        # spin speed in turns (rad/s)
TURN_EARLY_deg = 45    # a turn accepts the line from (angle - this) on: U-turn from 135 deg, 90 deg turns from 45 deg
TURN_LATE_deg = 240    # gives up a turn after (angle + this) without the line, then searches
TURN_TOL_Y = 0.022     # line counted as centred when this close to the axis, at the far band (m)
SEARCH_RATE = 1.0      # spin speed when searching for a lost line (rad/s)
N_OK = 3               # frames in a row with the line before taking it as found
T_MIN = 0.3            # min time in a state before "line lost" or "line found" counts (s)
# --- intersections (nodes) ---
V_NODE = 0.08          # speed from the node bar to the node centre (m/s)
K_HOLD = 2.0           # how hard it keeps its heading on the way to the node centre (1/s)
D_STRAIGHT = 0.20      # going straight: back to line following this far before the node centre (m)
D_BRAKE = 0.10         # turn at a node: slows from V_NODE to V_CREEP over the last D_BRAKE before the node centre (m)
V_CREEP = 0.04         # arrival speed at a turn node, and speed of the correction move (m/s). Too low: the wheels stall
NODE_TOL = 0.02        # stopped farther than this from the node centre: one slow move forward/back before turning (m)
T_SETTLE = 0.3         # wheels still for this long before the turn starts (s)
T_SCAN = 0.3           # after a turn at a node: still this long so the sonar (now facing the exit) reads it (s)
D_SCAN = 0             # obstacle closer than this on that exit: the mission drops it and the robot turns to another (m); 0 = off (test it first on the grid with params.ini)
PRIOR_TOL = 0.18       # mission only: a node seen farther than this from where the map expects it is ignored (m)
NODES = "both"         # with a MISSION only: who announces the nodes: "bars" (node_detector.py), "corners" (corner_detector.py) or "both"

[robot_hardware]
PORT = "/dev/ttyACM0"  # Arduino serial port
CAM_WIDTH = 640        # camera image width (px)
CAM_HEIGHT = 480       # camera image height (px)
CAM_FOV_deg = 62.2     # camera horizontal field of view: 62.2 camera v2, 53.5 camera v1.3
CAM_ROTATED_180 = True # camera mounted upside down: flip the image
USE_ENCODERS = True    # True: wheel speed controlled by the Arduino (PI) and heading from the encoders
V_MAX = 0.60           # top wheel speed (m/s)
PWM_MIN = 45           # PWM that just starts a wheel (only with USE_ENCODERS = False)
WHEEL_R = 0.0325       # wheel radius (m)
COUNTS_PER_REV = 234.3 # encoder counts per wheel turn (11 x 21.3)
SONAR_SIGN = 1         # 1: servo above 90 turns the sonar to the LEFT. Check: python3 diag.py sonar
SONAR_MAX_deg = 0      # widest sonar angle each side (servo 20..160 = 70). In FOLLOW it looks into the curve; 0 = off (test first: diag.py sonar, then params.ini)
LIVE_VIEW = True       # camera and mask in the browser: http://<pi-ip>:8000/

[node_detector]
# Only with a MISSION: with MISSION = None (the 8) no intersection is searched.
# "+", T and L nodes, traced on a top view of the floor (node_detector.py docstring; see them: replay_filters.py)
ZONE = (0.24, 0.38)    # distances ahead where a crossing is taken (m), inside the image (0.15-0.40); announced at the first one
CONTRAST = 30          # tape = at least this brighter than the floor around it (grey levels): a glare is not
TAPE_W = (0.016, 0.038) # accepted tape width, min and max (m). The tape is 0.025
MIN_COHERENCE = 0.4    # square tape pattern needed (0-1): a shoe or a tile edge is under it, tape 0.6-0.9
MAX_ANGLE_deg = 20     # a crossing only while the line is this close to the robot axis (not while spinning) (deg)
N_FRAMES = 3           # images to confirm an intersection
MISS = 1               # images without it tolerated while confirming
S_TOL = 0.03           # those images must agree on its position within this (m)
SAME = 0.10            # a crossing within this of the last intersection is the same one (m)

[corner_detector]
# Corner detection v4 (TP-dev-emb/TP_Dev_Emb/corner_detection_v4.py): a "+" crossing = EXPECTED concave corners.
# Only with a MISSION (and NODES "corners" or "both"): with MISSION = None (the 8) it is not even started.
# Only "+" nodes (exits S, L, R); T and L nodes stay with node_detector. N_FRAMES, S_TOL, SAME, ZONE: [node_detector]
PARALLEL = "process"   # "process": its own CPU core (Pi 3: 4 cores); "thread"; None: inside the FSM loop (slower loop)
REF_WIDTH = 1280       # image width the px sizes below were tuned for (v4: 1280x1024); scaled to CAM_WIDTH
BLUR = 8               # blur size (px at REF_WIDTH)
OPEN = 17              # opening: removes white smaller than this (px at REF_WIDTH). Keep it below the tape seen far
MIN_DIST = 15          # min distance between two corners (px at REF_WIDTH)
WIN = 25               # window where the white fraction around a corner is measured (px at REF_WIDTH)
MAX_CORNERS = 40       # corner candidates asked to goodFeaturesToTrack
QUALITY = 0.05         # goodFeaturesToTrack quality level
CONCAVE = (0.60, 0.85) # white fraction of a concave corner (~0.75); ~0.50 = straight edge, ~0.25 = tape end
EXPECTED = 3           # concave corners for a "+" (it has 4; 3 tolerates losing one)
